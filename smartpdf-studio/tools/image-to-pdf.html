<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fotos in PDF | SmartPDF Studio</title>
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/tools.css">
</head>
<body>
<div class="page-wrap">
    <div class="topbar">
        <a href="../../index.html" class="top-link">← Zur Startseite</a>
    </div>

    <header class="landing">
        <div class="hero-card">
            <h1>Fotos in PDF umwandeln</h1>
            <p>Wähle mehrere Bilder aus, prüfe die Vorschau und exportiere alles als saubere PDF-Datei.</p>
        </div>
    </header>

    <main class="tool-container">
        <div class="tool-layout">
            <section class="panel">
                <h2>Bildauswahl</h2>
                <p>Unterstützt JPG und PNG. Reihenfolge entspricht deiner Auswahl.</p>
                <div class="field">
                    <label for="imageInput">Bilder hochladen</label>
                    <input type="file" id="imageInput" multiple accept="image/png,image/jpeg,image/jpg">
                </div>
                <div class="actions">
                    <button id="generatePdfBtn" class="btn" type="button">PDF erstellen</button>
                </div>
            </section>

            <section class="panel">
                <h2>Vorschau</h2>
                <p id="imageMeta">Noch keine Bilder ausgewählt.</p>
                <div id="imagePreview" class="image-preview"></div>
            </section>
        </div>
    </main>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="../js/image-to-pdf.js"></script>
</body>
</html>
