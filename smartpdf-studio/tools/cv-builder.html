<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lebenslauf Builder | SmartPDF Studio</title>
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/tools.css">
</head>
<body>
<div class="page-wrap">
    <div class="topbar">
        <a href="../../index.html" class="top-link">← Zur Startseite</a>
    </div>

    <header class="landing">
        <div class="hero-card">
            <h1>Lebenslauf Builder</h1>
            <p>Fülle dein Profil aus und exportiere direkt einen professionellen PDF-Lebenslauf.</p>
        </div>
    </header>

    <main class="tool-container">
        <div class="tool-layout">
            <section class="panel">
                <h2>Deine Daten</h2>
                <p>Alle Felder bleiben lokal im Browser.</p>
                <form id="cvForm">
                    <div class="field">
                        <label for="name">Name</label>
                        <input type="text" id="name" placeholder="Max Mustermann" required>
                    </div>
                    <div class="field">
                        <label for="jobTitle">Berufsbezeichnung</label>
                        <input type="text" id="jobTitle" placeholder="Frontend Developer" required>
                    </div>
                    <div class="field">
                        <label for="summary">Profil</label>
                        <textarea id="summary" placeholder="Kurze Zusammenfassung über dich"></textarea>
                    </div>
                    <div class="field">
                        <label for="experience">Berufserfahrung</label>
                        <textarea id="experience" placeholder="Firmen, Positionen, Erfolge"></textarea>
                    </div>
                    <div class="field">
                        <label for="education">Ausbildung</label>
                        <textarea id="education" placeholder="Studium, Schule, Zertifikate"></textarea>
                    </div>
                    <div class="field">
                        <label for="skills">Fähigkeiten</label>
                        <textarea id="skills" placeholder="z. B. JavaScript, React, UI/UX"></textarea>
                    </div>
                    <div class="field">
                        <label for="photo">Profilfoto (optional)</label>
                        <input type="file" id="photo" accept="image/png,image/jpeg,image/jpg">
                    </div>
                    <div class="field">
                        <label for="templateSelect">Template</label>
                        <select id="templateSelect">
                            <option value="template1">Template 1 · Modern</option>
                            <option value="template2">Template 2 · Klassisch</option>
                            <option value="template3">Template 3 · Minimal</option>
                        </select>
                    </div>
                    <div class="actions">
                        <button type="button" id="generateCVBtn" class="btn">Lebenslauf als PDF erstellen</button>
                    </div>
                </form>
            </section>

            <section class="panel">
                <h2>Live-Notiz</h2>
                <p id="cvMeta">Noch nicht exportiert.</p>
                <div id="cvPreview" class="cv-preview">Sobald du exportierst, erscheint hier eine Zusammenfassung.</div>
            </section>
        </div>
    </main>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="../js/cv-builder.js"></script>
</body>
</html>
