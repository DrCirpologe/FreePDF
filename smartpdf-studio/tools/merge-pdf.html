<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF zusammenfügen | SmartPDF Studio</title>
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/tools.css">
</head>
<body>
<div class="page-wrap">
    <div class="topbar">
        <a href="../../index.html" class="top-link">← Zur Startseite</a>
    </div>

    <header class="landing">
        <div class="hero-card">
            <h1>PDF zusammenfügen</h1>
            <p>Lade mehrere PDFs hoch und kombiniere sie in der gewählten Reihenfolge zu einer Datei.</p>
        </div>
    </header>

    <main class="tool-container">
        <div class="tool-layout">
            <section class="panel">
                <h2>Dateien auswählen</h2>
                <p>Die Reihenfolge der Auswahl entspricht der Zusammenführung.</p>
                <div class="field">
                    <label for="mergeInput">Mehrere PDFs</label>
                    <input id="mergeInput" type="file" accept="application/pdf" multiple>
                </div>
                <div class="actions">
                    <button id="mergeBtn" type="button" class="btn">PDF zusammenfügen</button>
                </div>
            </section>

            <section class="panel">
                <h2>Status</h2>
                <p id="mergeMeta">Noch keine Dateien ausgewählt.</p>
                <div id="mergeList" class="cv-preview"></div>
            </section>
        </div>
    </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/pdf-lib/dist/pdf-lib.min.js"></script>
<script src="../js/merge-pdf.js"></script>
</body>
</html>
