<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF rotieren | Free PDF Studio</title>
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/tools.css">
</head>
<body>
<div class="page-wrap">
    <div class="topbar">
        <a href="../../index.html" class="top-link">← Zur Startseite</a>
        <a href="all-tools.html" class="top-link">Alle Tools</a>
    </div>

    <header class="landing">
        <div class="hero-card">
            <h1>PDF rotieren</h1>
            <p>Drehe alle oder ausgewählte Seiten um 90°, 180° oder 270°.</p>
        </div>
    </header>

    <main class="tool-container">
        <div class="tool-layout two-cols">
            <section class="panel">
                <h2>Datei und Optionen</h2>
                <div class="field">
                    <label for="rotateInput">PDF Datei</label>
                    <input id="rotateInput" type="file" accept="application/pdf">
                </div>
                <div class="field">
                    <label for="rotateDegrees">Winkel</label>
                    <select id="rotateDegrees">
                        <option value="90">90°</option>
                        <option value="180">180°</option>
                        <option value="270">270°</option>
                    </select>
                </div>
                <div class="field">
                    <label for="rotatePages">Seiten (leer = alle)</label>
                    <input id="rotatePages" type="text" placeholder="z. B. 1,3-5">
                </div>
                <div class="actions">
                    <button id="rotateBtn" type="button" class="btn">PDF rotieren</button>
                </div>
            </section>

            <section class="panel">
                <h2>Status</h2>
                <p id="rotateMeta">Bitte eine PDF wählen.</p>
                <div class="cv-preview">Wenn das Feld Seiten leer bleibt, werden alle Seiten gedreht.</div>
            </section>
        </div>
    </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/pdf-lib/dist/pdf-lib.min.js"></script>
<script src="../js/pdf-results-manager.js?v=20260226f"></script>
<script src="../js/rotate-pdf.js"></script>
</body>
</html>
