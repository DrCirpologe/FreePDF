<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seiten extrahieren | Free PDF Studio</title>
    <meta name="description" content="PDF Seiten extrahieren und als neue Datei speichern. Bestimmte Seitenbereiche einfach online aus einer PDF herauslösen.">
    <link rel="canonical" href="https://drcirpologe.github.io/FreePDF/smartpdf-studio/tools/extract-pages.html">
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/tools.css">
</head>
<body>
<div class="page-wrap">
    <div class="topbar">
        <a href="../../index.html" class="top-link">← Zur Startseite</a>
        <a href="all-tools.html" class="top-link">Alle Tools</a>
    </div>

    <header class="landing">
        <div class="hero-card">
            <h1>Seiten extrahieren</h1>
            <p>Hole nur die Seiten, die du brauchst, z. B. 1,3,7-9.</p>
        </div>
    </header>

    <main class="tool-container">
        <div class="tool-layout two-cols">
            <section class="panel">
                <h2>Datei und Seiten</h2>
                <div class="field">
                    <label for="extractInput">PDF Datei</label>
                    <input id="extractInput" type="file" accept="application/pdf">
                </div>
                <div class="field">
                    <label for="extractPages">Zu extrahierende Seiten</label>
                    <input id="extractPages" type="text" placeholder="z. B. 1,3,7-9">
                </div>
                <div class="actions">
                    <button id="extractBtn" type="button" class="btn">Seiten extrahieren</button>
                </div>
            </section>

            <section class="panel">
                <h2>Status</h2>
                <p id="extractMeta">Bitte eine PDF wählen.</p>
                <div class="cv-preview">Aus den ausgewählten Seiten wird eine neue PDF erzeugt.</div>
            </section>
        </div>
    </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/pdf-lib/dist/pdf-lib.min.js"></script>
<script src="../js/pdf-results-manager.js?v=20260226g"></script>
<script src="../js/extract-pages.js"></script>
</body>
</html>
