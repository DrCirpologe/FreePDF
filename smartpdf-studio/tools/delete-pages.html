<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seiten löschen | Free PDF Studio</title>
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/tools.css">
</head>
<body>
<div class="page-wrap">
    <div class="topbar">
        <a href="../../index.html" class="top-link">← Zur Startseite</a>
        <a href="all-tools.html" class="top-link">Alle Tools</a>
    </div>

    <header class="landing">
        <div class="hero-card">
            <h1>Seiten löschen</h1>
            <p>Entferne gezielt Seiten aus deiner PDF, z. B. 2,4-6.</p>
        </div>
    </header>

    <main class="tool-container">
        <div class="tool-layout two-cols">
            <section class="panel">
                <h2>Datei und Seiten</h2>
                <div class="field">
                    <label for="deleteInput">PDF Datei</label>
                    <input id="deleteInput" type="file" accept="application/pdf">
                </div>
                <div class="field">
                    <label for="deletePages">Zu löschende Seiten</label>
                    <input id="deletePages" type="text" placeholder="z. B. 2,4-6">
                </div>
                <div class="actions">
                    <button id="deleteBtn" type="button" class="btn">Seiten löschen</button>
                </div>
            </section>

            <section class="panel">
                <h2>Status</h2>
                <p id="deleteMeta">Bitte eine PDF wählen.</p>
                <div class="cv-preview">Tipp: Bereiche mit Komma trennen, z. B. 2,4-6,9.</div>
            </section>
        </div>
    </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/pdf-lib/dist/pdf-lib.min.js"></script>
<script src="../js/pdf-results-manager.js"></script>
<script src="../js/delete-pages.js"></script>
</body>
</html>
