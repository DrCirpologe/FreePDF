<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | SmartPDF Studio</title>
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/tools.css">
</head>
<body>
<div class="page-wrap">
    <div class="topbar">
        <a href="../../index.html" class="top-link">← Zur Startseite</a>
    </div>

    <header class="landing hidden">
        <div class="hero-card">
            <h1>Login</h1>
            <p>Melde dich an, um deine PDFs und Lebensläufe zu verwalten.</p>
        </div>
    </header>

    <main class="tool-container hidden">
        <div class="tool-layout">
            <section class="panel">
                <h2>Account-Anmeldung</h2>
                <p>Phase 2 vorbereitet, aktuell noch nicht freigeschaltet.</p>
                <form id="loginForm">
                    <div class="field">
                        <label for="email">E-Mail</label>
                        <input type="email" id="email" placeholder="name@mail.com" required>
                    </div>
                    <div class="field">
                        <label for="password">Passwort</label>
                        <input type="password" id="password" placeholder="••••••••" required>
                    </div>
                    <div class="actions">
                        <button type="button" id="loginBtn" class="btn">Anmelden</button>
                    </div>
                </form>
            </section>
        </div>
    </main>
</div>

<script src="../js/login.js"></script>
</body>
</html>
