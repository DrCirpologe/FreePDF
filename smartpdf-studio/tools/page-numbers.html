<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seitennummern hinzufügen | Free PDF Studio</title>
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/tools.css">
</head>
<body>
<div class="page-wrap">
    <div class="topbar">
        <a href="../../index.html" class="top-link">← Zur Startseite</a>
        <a href="all-tools.html" class="top-link">Alle Tools</a>
    </div>

    <header class="landing">
        <div class="hero-card">
            <h1>Seitennummern hinzufügen</h1>
            <p>Nummeriere PDF-Seiten mit Startwert und Position.</p>
        </div>
    </header>

    <main class="tool-container">
        <div class="tool-layout two-cols">
            <section class="panel">
                <h2>Datei und Nummerierung</h2>
                <div class="field">
                    <label for="numberInput">PDF Datei</label>
                    <input id="numberInput" type="file" accept="application/pdf">
                </div>
                <div class="field">
                    <label for="numberStart">Startnummer</label>
                    <input id="numberStart" type="text" value="1">
                </div>
                <div class="field">
                    <label for="numberPosition">Position</label>
                    <select id="numberPosition">
                        <option value="bottom-center">Unten Mitte</option>
                        <option value="bottom-left">Unten Links</option>
                        <option value="bottom-right">Unten Rechts</option>
                        <option value="top-left">Oben Links</option>
                        <option value="top-right">Oben Rechts</option>
                    </select>
                </div>
                <div class="field">
                    <label for="numberPages">Seiten (leer = alle)</label>
                    <input id="numberPages" type="text" placeholder="z. B. 1-5,8">
                </div>
                <div class="actions">
                    <button id="numberBtn" type="button" class="btn">Seitennummern hinzufügen</button>
                </div>
            </section>

            <section class="panel">
                <h2>Status</h2>
                <p id="numberMeta">Bitte eine PDF wählen.</p>
                <div class="cv-preview">Ideal für Berichte, Angebote, Verträge und Bewerbungsunterlagen.</div>
            </section>
        </div>
    </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/pdf-lib/dist/pdf-lib.min.js"></script>
<script src="../js/page-numbers.js"></script>
</body>
</html>
